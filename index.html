<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F2C200">
    <meta name="description" content="Generador de Tarjetas QR y Búsqueda de Stock">
    <title>QR Generator & Stock</title>
    
    <!-- MANIFEST -->
    <link rel="manifest" href="manifest.json">
    
    <!-- ===== CSS ===== -->
    <link rel="stylesheet" href="/QR-Cards-Generator/css/styles.css">
    <link rel="stylesheet" href="/QR-Cards-Generator/css/stock.css">
    
    <!-- Bibliotecas externas -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- ====== INDICADOR DE PÁGINA ====== -->
        <div class="page-indicator">
            <span class="dot active" data-page="0"></span>
            <span class="dot" data-page="1"></span>
        </div>

        <!-- ====== CONTENEDOR DE PÁGINAS (SWIPE) ====== -->
        <div class="pages-wrapper" id="pagesWrapper">
            <!-- Página 1: Generador QR (actual) -->
            <section id="qrPage" class="page qr-page">
                <!-- Contenido generado dinámicamente desde app.js -->
            </section>

            <!-- Página 2: Búsqueda de Stock (nueva) -->
            <section id="stockPage" class="page stock-page">
                <!-- Contenido generado dinámicamente desde stock.js -->
            </section>
        </div>
    </div>

    <!-- ====== SCRIPTS ====== -->
    <!-- Sistema de navegación (nuevo) -->
    <script type="module" src="js/navigation.js"></script>
    
    <!-- App QR Generator (modificado para inyectar en su página) -->
    <script type="module" src="js/app.js"></script>
    
    <!-- App Stock Search (nuevo) -->
    <script type="module" src="js/stock.js"></script>
</body>
</html>
